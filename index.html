<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<title>Critical Research • Loading verified artifact</title>
<style>
:root{color-scheme:dark;--violet:#9d5cff;--cyan:#5ffbf1;--bg:#09040f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#eee7ff;font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-image:radial-gradient(circle at 18% 12%,#6e2bb95c,transparent 42%),radial-gradient(circle at 82% 78%,#5ffbf11f,transparent 38%)}main{width:min(760px,calc(100vw - 32px));padding:32px;border:1px solid #9d5cff70;border-radius:22px;background:linear-gradient(145deg,#281344cc,#11091dcc);box-shadow:0 0 60px #9d5cff30,inset 0 1px #ffffff13;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem);letter-spacing:-.04em}p{margin:.5rem 0 1rem;color:#cfc3e6}code{color:var(--cyan);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.bar{height:5px;border-radius:999px;background:#2b1645;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:34%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan));animation:load 1.25s infinite ease-in-out}@keyframes load{0%{transform:translateX(-110%)}50%,100%{transform:translateX(310%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none;width:100%}}
</style>
</head>
<body><main><h1>Critical Research</h1><p>Reconstructing the source-audited standalone artifact and verifying its SHA-256 before execution.</p><div class="bar" aria-hidden="true"></div><p><code id="status" role="status">Loading payload…</code></p></main>
<script>
(async()=>{
  const expected='271a0e0b1ef29c1c72b01fd825bc47920a56c4919e0c39abe39052be863cef8e';
  const status=document.getElementById('status');
  const parts=Array.from({length:8},(_,i)=>`./payload-${String(i).padStart(2,'0')}.b64`);
  const texts=[];
  for(let i=0;i<parts.length;i++){
    status.textContent=`Loading verified payload ${i+1}/${parts.length}…`;
    const r=await fetch(parts[i],{cache:'no-store'});
    if(!r.ok) throw new Error(`Missing ${parts[i]}`);
    texts.push(await r.text());
  }
  const b64=texts.join('').replace(/\s+/g,'');
  const compressed=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('This browser does not support native gzip decompression. Use a current Chromium, Firefox, or Safari browser.');
  status.textContent='Decompressing artifact…';
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
  status.textContent='Verifying SHA-256…';
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
  const actual=[...digest].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(actual!==expected) throw new Error(`Integrity failure: expected ${expected.slice(0,12)}…, got ${actual.slice(0,12)}…`);
  status.textContent='Integrity verified. Starting workstation…';
  const html=new TextDecoder().decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  const s=document.getElementById('status');
  if(s) s.textContent='Deployment error: '+err.message;
  console.error(err);
});
</script></body></html>
