<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Critical Research • Loading verified artifact</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0512;color:#ede6ff;font:15px/1.6 system-ui,sans-serif;background-image:radial-gradient(circle at 20% 10%,#6223a955,transparent 45%),radial-gradient(circle at 80% 80%,#5ffbf122,transparent 40%)}main{max-width:760px;padding:32px;border:1px solid #9d5cff66;border-radius:18px;background:#1e0e34bb;box-shadow:0 0 40px #9d5cff33;backdrop-filter:blur(16px)}code{color:#5ffbf1}.bar{height:5px;border-radius:9px;background:#2b1645;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:35%;background:linear-gradient(90deg,#9d5cff,#5ffbf1);animation:load 1.2s infinite ease-in-out}@keyframes load{50%{transform:translateX(190%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none;width:100%}}
</style>
</head>
<body><main><h1>Critical Research</h1><p>Reconstructing the source-audited standalone artifact and verifying its SHA-256 before execution.</p><div class="bar"></div><p><code id="status">Loading payload…</code></p></main>
<script>
(async()=>{
 const expected='88d29ace69363c11677fe329f9b6f3f72379c3251b5bb4d95099b8f499212956';
 const status=document.getElementById('status');
 const parts=Array.from({length:8},(_,i)=>`./payload-${String(i).padStart(2,'0')}.b64`);
 const texts=await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Missing ${p}`);return r.text();})));
 const b64=texts.join('').replace(/\s+/g,'');
 const compressed=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 status.textContent='Decompressing artifact…';
 const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
 const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
 const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
 const actual=[...digest].map(b=>b.toString(16).padStart(2,'0')).join('');
 if(actual!==expected) throw new Error('Integrity failure: SHA-256 mismatch');
 status.textContent='Integrity verified. Starting workstation…';
 const html=new TextDecoder().decode(bytes);
 document.open();document.write(html);document.close();
})().catch(err=>{document.getElementById('status').textContent='Deployment error: '+err.message;console.error(err);});
</script></body></html>
